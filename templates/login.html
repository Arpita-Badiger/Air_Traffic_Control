{% extends "base.html" %}

{% block title %}Login - Air Traffic System{% endblock %}

{% block content %}
<center>
<div class="min-h-screen flex items-center justify-center px-4 sm:px-6 -mt-16 sm:-mt-24 md:-mt-32">
    <div class="bg-white dark:bg-gray-800 p-6 sm:p-8 rounded-xl shadow-xl w-full max-w-md transform transition-all hover:scale-105 duration-300">
        <div class="text-center mb-6 sm:mb-8">
            <h1 class="text-2xl sm:text-3xl font-bold text-gray-800 dark:text-white">Welcome Back</h1>
            <p class="text-gray-600 dark:text-gray-300 mt-2">Sign in to your account</p>
        </div>
        
        <form method="POST" action="{{ url_for('login') }}" class="space-y-5 sm:space-y-6">
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Email Address</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                       
                    </div>
                    <input type="email" id="email" name="email" required 
                           class="w-full pl-10 p-2.5 sm:p-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:text-white">
                </div>
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Password</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                       
                    </div>
                    <input type="password" id="password" name="password" required 
                           class="w-full pl-10 p-2.5 sm:p-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:text-white">
                </div>
            </div>
            <div>
                <button type="submit" class="w-full bg-gradient-to-r from-blue-500 to-indigo-600 text-white p-2.5 sm:p-3 rounded-lg font-medium hover:from-blue-600 hover:to-indigo-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 shadow-lg transform transition-all hover:scale-105 duration-300">
                    Sign In
                </button>
            </div>
        </form>
        <div class="mt-6 sm:mt-8 text-center">
            <p class="text-gray-600 dark:text-gray-400">Don't have an account? 
                <a href="{{ url_for('signup') }}" class="text-blue-500 dark:text-blue-400 hover:underline font-medium">Sign up</a>
            </p>
        </div>
    </div>
</div>
</center>
{% endblock %}
