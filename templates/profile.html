{% extends "base.html" %}

{% block title %}User Profile{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto px-4 sm:px-6">
    <div class="flex items-center justify-center mb-8 mt-4">
        <div class="bg-gradient-to-r from-blue-400 to-indigo-500 p-1 rounded-full shadow-lg">
            <div class="bg-white dark:bg-gray-800 rounded-full p-1">
                
            </div>
        </div>
    </div>
    
    <h1 class="text-2xl sm:text-3xl font-bold text-center mb-8 text-gray-800 dark:text-white">Your Profile</h1>
    
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 sm:gap-8">
        <!-- Account Information -->
        <div class="bg-white dark:bg-gray-800 p-4 sm:p-6 rounded-xl shadow-lg transform transition-all hover:scale-105 duration-300">
            <div class="flex items-center mb-6 border-b pb-3 dark:border-gray-700">
                
                <h2 class="text-lg sm:text-xl font-bold text-gray-800 dark:text-white">Account Information</h2>
            </div>
            
            <div class="space-y-4 sm:space-y-6">
                <div>
                    <label class="block text-sm font-medium text-gray-600 dark:text-gray-400 mb-2">Name</label>
                    <div class="p-3 bg-gray-100 dark:bg-gray-700 rounded-lg text-gray-800 dark:text-gray-200 font-medium overflow-hidden text-ellipsis">
                        {{ current_user.name }}
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 dark:text-gray-400 mb-2">Email</label>
                    <div class="p-3 bg-gray-100 dark:bg-gray-700 rounded-lg text-gray-800 dark:text-gray-200 font-medium overflow-hidden text-ellipsis">
                        {{ current_user.email }}
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 dark:text-gray-400 mb-2">Account Type</label>
                    <div class="p-3 bg-gray-100 dark:bg-gray-700 rounded-lg text-gray-800 dark:text-gray-200 font-medium">
                        {% if current_user.id == 1 %}
                            <span class="text-yellow-600 dark:text-yellow-400 font-semibold">Administrator</span>
                        {% else %}
                            <span>Standard User</span>
                        {% endif %}
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Update Password -->
        <div class="bg-white dark:bg-gray-800 p-4 sm:p-6 rounded-xl shadow-lg transform transition-all hover:scale-105 duration-300">
            <div class="flex items-center mb-6 border-b pb-3 dark:border-gray-700">
                
                <h2 class="text-lg sm:text-xl font-bold text-gray-800 dark:text-white">Update Password</h2>
            </div>
            
            <form method="POST" action="{{ url_for('update_password') }}" class="space-y-4">
                <div>
                    <label for="current_password" class="block text-sm font-medium text-gray-600 dark:text-gray-400 mb-2">Current Password</label>
                    <input type="password" id="current_password" name="current_password" required 
                           class="w-full p-2 sm:p-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:text-white">
                </div>
                <div>
                    <label for="new_password" class="block text-sm font-medium text-gray-600 dark:text-gray-400 mb-2">New Password</label>
                    <input type="password" id="new_password" name="new_password" required 
                           class="w-full p-2 sm:p-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:text-white">
                </div>
                <div>
                    <label for="confirm_new_password" class="block text-sm font-medium text-gray-600 dark:text-gray-400 mb-2">Confirm New Password</label>
                    <input type="password" id="confirm_new_password" name="confirm_new_password" required 
                           class="w-full p-2 sm:p-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:text-white">
                </div>
                <div class="pt-2">
                    <button type="submit" class="w-full bg-gradient-to-r from-blue-500 to-indigo-600 text-white p-2 sm:p-3 rounded-lg font-medium hover:from-blue-600 hover:to-indigo-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 shadow-lg transform transition-all hover:scale-105 duration-300">
                        Update Password
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
